[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "human-trajectory-model"
version = "0.1.0"
description = "Open schemas, validators, and benchmark infrastructure for human trajectory research"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Human Trajectory Model Contributors" }]
dependencies = [
  "jsonschema>=4.23,<5",
  "PyYAML>=6.0,<7",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9",
]

[project.scripts]
htm = "htm.cli:main"

[project.urls]
Repository = "https://github.com/DeeplumenClaw/human-trajectory-model"
Issues = "https://github.com/DeeplumenClaw/human-trajectory-model/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
