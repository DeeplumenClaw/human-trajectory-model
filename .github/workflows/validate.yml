name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Validate synthetic records
        run: htm validate examples/synthetic/*.json

      - name: Run synthetic benchmark smoke test
        run: htm benchmark benchmark/tasks/next-event-synthetic-v0.1.yaml

      - name: Run tests
        run: pytest -q
