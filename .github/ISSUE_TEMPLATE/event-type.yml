name: Propose or revise a life-event type
description: Add a precise, reviewable event definition to the HTM ontology
title: "[Event type] "
body:
  - type: markdown
    attributes:
      value: |
        Event types are contribution contracts. A definition should be usable by someone other than its author.
  - type: input
    id: event_id
    attributes:
      label: Proposed event ID
      description: Use a stable namespaced ID such as career.role_change.
      placeholder: domain.event_name
    validations:
      required: true
  - type: input
    id: domain
    attributes:
      label: Domain
      placeholder: career
    validations:
      required: true
  - type: textarea
    id: definition
    attributes:
      label: Inclusion definition
      description: State what must be true for this label to apply.
    validations:
      required: true
  - type: textarea
    id: examples
    attributes:
      label: Positive examples
    validations:
      required: true
  - type: textarea
    id: exclusions
    attributes:
      label: Exclusions and boundary cases
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Cultural, historical, privacy, or leakage risks
    validations:
      required: true
  - type: checkboxes
    id: data_policy
    attributes:
      label: Data declaration
      options:
        - label: This proposal contains no private-conversation case or unconsented private-person data.
          required: true
