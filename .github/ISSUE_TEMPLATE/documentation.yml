name: Documentation or terminology improvement
description: Correct, clarify, translate, or improve an existing public artifact
title: "[Docs] "
body:
  - type: input
    id: location
    attributes:
      label: File or section
      placeholder: README.md — Current artifact
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: Proposed change
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: Sources or terminology notes
  - type: checkboxes
    id: declaration
    attributes:
      label: Declaration
      options:
        - label: This issue contains no repository-owner trajectory data and is not derived from the owner's private communications.
          required: true
        - label: Any non-synthetic third-party source cited here has a declared public, consent, license, or approved-protocol basis.
          required: true
